<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TODOリスト">
<title>TODOリスト</title>
<link rel="manifest" href="list.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#ffffff;--text:#1f2328;--muted:#9aa0a6;--line:#e8e8ea;--accent:#4fb3a6;--accent-ink:#ffffff;
  --btn:#ffffff;--shadow:0 4px 14px rgba(0,0,0,.08);--panel:#ffffff;--scrim:rgba(0,0,0,.28);--warn:#e5484d;
  --c-pink:#fcecfb;--c-yellow:#fff5d1;--c-blue:#e5f0ff;--c-green:#e3f6ee;--c-gray:#f1f1f3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111315;--text:#e8eaed;--muted:#8a9096;--line:#26292d;--btn:#1c1f22;--shadow:0 4px 14px rgba(0,0,0,.5);
    --panel:#1c1f22;--scrim:rgba(0,0,0,.55);--c-pink:#3a2535;--c-yellow:#3a3420;--c-blue:#1f2d40;--c-green:#1d3329;--c-gray:#2a2d31;
    color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"Hiragino Sans","Segoe UI","Yu Gothic UI","Meiryo",sans-serif;min-height:100vh;
  padding-bottom:calc(140px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.top{display:flex;align-items:center;gap:12px;padding:0 18px}
.round{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;position:relative}
a.round{color:var(--text)}
.round .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.grow{flex:1}
.search{flex:1;display:flex;align-items:center;gap:6px;height:42px;padding:0 6px 0 14px;border-radius:21px;background:var(--btn);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none}
.search button{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 18px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:10px;max-width:72vw;height:40px;padding:0 16px;border-radius:20px;
  border:1px solid var(--line);background:var(--btn);box-shadow:var(--shadow);font-size:16px;white-space:nowrap}
.tab .tn{overflow:hidden;text-overflow:ellipsis}
.tab .tc{color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.on .tc{color:var(--accent-ink);opacity:.85}
.tab.add{padding:0 14px;color:var(--muted)}

/* ---------- sections and tasks ---------- */
main{padding:0 0 0 18px;max-width:760px;margin:0 auto}
main.slide-l{animation:slidel .18s ease-out} main.slide-r{animation:slider .18s ease-out}
@keyframes slidel{from{transform:translateX(24px);opacity:.4}} @keyframes slider{from{transform:translateX(-24px);opacity:.4}}
.sec{margin-top:8px;margin-bottom:22px}
.shead{display:flex;align-items:center;gap:8px;padding:10px 18px 12px 0;border-bottom:1px solid var(--line)}
.sname{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--accent);font-size:19px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scount{color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.sfold{border:0;background:none;color:var(--muted);padding:4px;display:flex}
.sfold svg{width:20px;height:20px;transition:transform .15s;transform:rotate(90deg)}
.sec.closed .sfold svg{transform:none}
.sec.closed .items{display:none}
.sec.drop .shead{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.item{position:relative;display:flex;align-items:center;gap:16px;min-height:58px;margin-left:-18px;padding:10px 18px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;background:var(--bg)}
.item::after{content:"";position:absolute;left:62px;right:0;bottom:0;border-bottom:1px solid var(--line)}
/* the date column, right of the check circle; kept even when empty so the tasks line up */
.dcol{flex:none;width:68px;margin-right:-4px;font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.dcol small{display:block;font-size:11px;font-weight:500}
.dcol.today{color:var(--warn);font-weight:700}
.dcol.late{color:#f08c2e}
.item.checked .dcol{opacity:.5}
.cdate{flex:none;font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px 10px}
.item.c-pink{background:var(--c-pink)} .item.c-yellow{background:var(--c-yellow)} .item.c-blue{background:var(--c-blue)}
.item.c-green{background:var(--c-green)} .item.c-gray{background:var(--c-gray)}
.circle{flex:none;position:relative;width:28px;height:28px;border-radius:50%;border:1.5px solid #a8acb1;background:transparent;padding:0}
.circle::before{content:"";position:absolute;inset:-12px}
.circle.on{background:var(--accent);border-color:var(--accent)}
/* checked: stays in the list, greyed out, until the bin button throws it away */
.item.checked,.item.checked[class*=c-]{background:var(--c-gray)}
.item.checked .circle{background:#a8acb1;border-color:#a8acb1}
.item.checked .circle::after,.circle.on::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.item.checked .txt{color:var(--muted);text-decoration:line-through}
.txt{flex:1;min-width:0;font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word;transition:color .2s}
/* priority and 対応中, small on the right of a task */
.tags{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:9px;white-space:nowrap;color:#fff}
.tag.high{background:#e5484d} .tag.mid{background:#f08c2e} .tag.low{background:#8b9198}
.tag.doing{background:none;color:var(--accent);border:1px solid var(--accent);padding:3px 6px}
.item.checked .tags{opacity:.45}
.dates2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px 0;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.memo{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.where{font-size:12px;color:var(--accent);margin-bottom:1px}
.item.dragging{z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:10px;margin-left:0;cursor:grabbing}
.item.dragging::after{display:none}
.ph{margin-left:-18px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px}
.empty{color:var(--muted);font-size:14px;padding:16px 0}
.items:has(.ph) .empty{display:none}
.addsec{display:block;margin:6px 0 0;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:12px 16px;font-size:15px;width:calc(100% - 18px)}
.rhead{color:var(--accent);font-size:14px;font-weight:700;padding:14px 0 8px;border-bottom:1px solid var(--line)}

/* ---------- floating buttons ---------- */
.fab{position:fixed;z-index:12;right:max(20px,calc(50% - 360px));bottom:calc(26px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;
  background:var(--accent);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 50%,transparent);display:flex;align-items:center;justify-content:center}
.fab svg{width:30px;height:30px;stroke-width:2.4}
.trash{position:fixed;z-index:12;left:max(20px,calc(50% - 360px));bottom:calc(30px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;
  background:var(--btn);color:var(--accent);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.trash b{position:absolute;top:-2px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;line-height:20px}
.trash b:empty{display:none}

/* ---------- split (wide screens): the list on the left, then a second list and/or TODO Tree ---------- */
.treepane{display:none}
body.pane-tree .treepane{display:block;position:fixed;z-index:5;top:0;bottom:0;right:0;left:var(--tl);background:#05112a;border-left:1px solid var(--line)}
.treepane iframe{display:block;width:100%;height:100%;border:0}
.divider{display:none;position:fixed;z-index:7;left:calc(var(--lw) - 6px);top:0;bottom:0;width:12px;cursor:col-resize;touch-action:none}
body.split .divider{display:block}
.divider:hover,.divider.on{background:linear-gradient(90deg,transparent 5px,var(--accent) 5px,var(--accent) 7px,transparent 7px)}
body.resizing{user-select:none;-webkit-user-select:none;cursor:col-resize}
body.resizing .treepane iframe{pointer-events:none}
body.split header,body.split main{width:var(--lw);max-width:none;margin:0}
body.split .fab{right:auto;left:calc(var(--lw) - 88px)}
body.split .trash{left:20px}
body.split .toast{left:calc(var(--lw) / 2)}
body.split .sheet{left:calc(var(--lw) / 2);width:min(520px,calc(var(--lw) - 24px))}
body.split .composer{left:calc(var(--lw) / 2);width:min(600px,calc(var(--lw) - 24px))}
#bTree.on,#bCols.on,#bCal.on{background:var(--accent);color:#fff}
@media (max-width:899px){#bCols{display:none}}
/* on a PC the two pane buttons also say what they show */
.lbl{display:none}
@media (min-width:900px){#bCols,#bTree,#bCal{width:auto;padding:0 16px 0 12px;border-radius:23px;gap:6px;text-decoration:none}.lbl{display:inline;font-size:14px;font-weight:600}}
/* the second list column, in the right pane */
.col2{display:none;position:fixed;z-index:5;top:0;bottom:0;left:var(--lw);right:0;overflow:auto;background:var(--bg);border-left:1px solid var(--line);overscroll-behavior:contain}
body.pane-list .col2{display:block}
body.pane-list:is(.pane-tree,.pane-cal) .col2{right:auto;width:var(--lw)}
/* ---------- 予定: a month calendar of the tasks' dates, in the rightmost pane (full screen on phones) ---------- */
.calpane{display:none;position:fixed;z-index:5;top:0;bottom:0;right:0;left:var(--tl);background:var(--bg);border-left:1px solid var(--line);flex-direction:column}
body.pane-cal .calpane{display:flex}
body.cal-full .calpane{display:flex;z-index:30;left:0;border-left:0}
.calhead{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.calhead h2{margin:0 6px;font-size:17px;white-space:nowrap}
.calhead .b{flex:none;min-width:0;padding:6px 12px;font-size:14px}
.calhead .nav{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1}
.calhead .x{margin-left:auto}
.calview{flex:none;display:flex;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-left:4px}
.calview button{border:0;background:var(--bg);padding:6px 13px;font-size:13px}
.calview button.on{background:var(--accent);color:#fff}
body:not(.cal-full) .calview{margin-left:auto}
/* phones: a shorter title and tighter controls, so they fit on one line */
body.cal-full .calhead{gap:5px;padding-left:10px;padding-right:6px}
body.cal-full .calhead h2{font-size:15px;margin:0 1px}
body.cal-full .calhead .nav{width:30px;height:30px}
body.cal-full .calhead .b{padding:5px 8px;font-size:13px}
body.cal-full .calview{margin-left:2px}
body.cal-full .calview button{padding:5px 9px}
body.cal-full .calhead .x{padding:2px 4px}
body:not(.cal-full) .calhead .x{display:none}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.calwd .sat,.cday .n.sat{color:#3b82f6} .calwd .sun,.cday .n.sun{color:var(--warn)}
.calgrid{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* a week: the day cells behind, the tasks laid in lanes on top so a stretch of days is one bar */
.cweek{--lane:20px;position:relative;flex:1 0 auto;min-height:calc(30px + var(--lane) * 5);border-bottom:1px solid var(--line)}
/* 週: one week fills the pane and shows every task */
.cweek.full{--lane:24px;min-height:100%;padding-bottom:12px}
.cweek.full .cwfg{position:relative;top:0;padding-top:30px}
.cweek.full .ev{font-size:12.5px}
body.cal-full .cweek.full{--lane:40px}
body.cal-full .cweek.full .ev{font-size:11px;-webkit-line-clamp:3}
body.cal-full .cweek.full .ev span{-webkit-line-clamp:3}
.cwbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cwfg{position:absolute;left:0;right:0;top:28px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:var(--lane);row-gap:1px;pointer-events:none}
.cday{min-width:0;border-right:1px solid var(--line);padding:3px 3px 0;cursor:pointer}
.cday:nth-child(7n){border-right:0}
.cday.out{background:color-mix(in srgb,var(--line) 35%,transparent)}
.cday.out .chd{opacity:.45}
.cday:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.cday.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.chd{display:flex;align-items:center;gap:3px;min-width:0;height:22px}
.chd .n{flex:none;min-width:22px;height:22px;line-height:22px;border-radius:11px;text-align:center;font-size:12.5px;font-weight:600}
.cday .n.sat{color:#3b82f6} .cday .n.sun{color:var(--warn)}
.chd .hol{font-size:10.5px;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday.today .n{background:var(--warn);color:#fff}
.calwd .sat{color:#3b82f6} .calwd .sun{color:var(--warn)}
.ev{--ec:var(--accent);pointer-events:auto;display:flex;align-items:center;gap:4px;min-width:0;margin:0 2px;font-size:11.5px;line-height:1.3;padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;cursor:pointer}
.ev::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ec)}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:color-mix(in srgb,var(--ec) 14%,transparent)}
/* several days: a filled bar; one cut by the week's edge runs on into the next row */
.ev.bar{background:var(--ec);color:#fff}
.ev.bar::before{display:none}
.ev.bar:hover{filter:brightness(1.08)}
.ev.cont-l{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.ev.cont-r{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.ev.done{opacity:.55;text-decoration:line-through}
.ev .bang{color:#e5484d;font-weight:800}
.ev.bar .bang{color:#fff}
.ev.tree{cursor:default}
.ev.more{color:var(--muted);padding-left:6px}
.ev.more::before{display:none}
.ev.moving{opacity:.35}
.calfilter{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.calfilter::-webkit-scrollbar{display:none}
.cf{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.cf i{width:10px;height:10px;border-radius:50%;background:var(--ec);opacity:.35}
.cf.on{color:var(--text);border-color:var(--ec);background:color-mix(in srgb,var(--ec) 10%,var(--bg))}
.cf.on i{opacity:1}
/* phones: narrow days, so names wrap and lose the dot */
body.cal-full .cweek{--lane:26px;min-height:calc(26px + var(--lane) * 4)}
body.cal-full .ev{white-space:normal;align-items:flex-start;padding:1px 2px 1px 3px;margin:0 1px;font-size:10px;line-height:1.2}
body.cal-full .ev:not(.bar){border-left:3px solid var(--ec);border-radius:2px}
body.cal-full .ev::before{display:none}
body.cal-full .ev span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
body.cal-full .chd .hol{display:none}
.callegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.callegend .ev{display:inline-flex;padding:0;pointer-events:none}
.col2 .tabs{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:calc(16px + env(safe-area-inset-top))}
.colmain{padding:0 0 140px 18px;max-width:760px}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  padding:10px 10px 10px 18px;border-radius:12px;background:#2b2f33;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.toast button{border:0;background:none;color:#7fe0d3;font-weight:700;padding:6px 8px}

/* ---------- sheets, drawer, composer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:720px){.sheet{left:50%;right:auto;bottom:auto;top:12vh;width:520px;transform:translateX(-50%);border-radius:16px;max-height:76vh}}
.shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shd h2{margin:0;font-size:17px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:2px 6px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px}
.in{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.in:focus{outline:none;border-color:var(--accent)}
textarea.in{resize:none;overflow:hidden;line-height:1.45}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw button.on{outline:2px solid var(--accent);outline-offset:2px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.b{flex:1;min-width:110px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-size:15px}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.warn{color:var(--warn)}
.rowx{display:flex;align-items:center;gap:8px;margin-top:8px}
.rowx .in{flex:1}
.ib{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px}
.ib.warn{color:var(--warn)}
.ib:disabled{opacity:.35}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 0 0}
.msg{font-size:13px;color:var(--warn);min-height:1.4em;margin:8px 0 0}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid currentColor;color:var(--muted)}
.pill[data-s=ok]{color:var(--accent)} .pill[data-s=err]{color:var(--warn)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:14px;color:var(--text)!important}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hr{border:0;border-top:1px solid var(--line);margin:22px 0 6px}
.done-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.done-row .txt{color:var(--muted);text-decoration:line-through;font-size:16px}

.drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(320px,84vw);overflow:auto;background:var(--panel);
  padding:calc(18px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));box-shadow:8px 0 30px rgba(0,0,0,.2)}
.drawer h2{margin:0 22px 10px;font-size:15px;color:var(--muted);font-weight:600}
.dl{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px 22px;font-size:16px;text-align:left}
.dl.on{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .c{color:var(--muted);font-weight:400}
.dl.sub{color:var(--muted);font-size:15px}
.dfoot{margin:16px 22px 0}

.composer{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:720px){.composer{left:50%;right:auto;width:600px;transform:translateX(-50%);bottom:20px!important;border-radius:16px}}
.crow{display:flex;align-items:flex-end;gap:10px}
.crow textarea{flex:1;max-height:40vh;overflow:auto}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.4}
.cchips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none;align-items:center}
.cchips::-webkit-scrollbar{display:none}
.cchip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 12px;font-size:13px;white-space:nowrap}
.cchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cdot{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);padding:0}
.cdot.on{outline:2px solid var(--accent);outline-offset:1px}
.csep-t{flex:none;color:var(--muted);font-size:13px}
.csep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="round" id="bMenu" aria-label="リスト一覧"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="search" id="searchBox" hidden><input id="q" type="search" placeholder="すべてのリストを検索" enterkeyhint="search"><button id="qClose" aria-label="検索を閉じる">×</button></div>
    <span class="grow" id="spacer"></span>
    <button class="round" id="bCal" aria-label="予定（カレンダー）を表示" title="タスクの日付をカレンダーで見る"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="lbl">予定</span></button>
    <button class="round" id="bCols" aria-label="TODOリストを2列に並べる" title="リストを2列に並べる"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.5"/></svg><span class="lbl">2列</span></button>
    <a class="round" id="bTree" href="index.html" aria-label="TODO Tree（ツリー表示）を開く" title="TODO Tree を開く"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg><span class="lbl">ツリー</span></a>
    <button class="round" id="bSearch" aria-label="検索"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <button class="round" id="bSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><i class="dot" id="setDot" hidden></i></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="col2" id="col2"><nav class="tabs" id="tabs2"></nav><div class="colmain" id="main2"></div></div>
<section class="calpane" id="calPane" aria-label="予定">
  <div class="calhead"><button class="nav" id="calPrev" aria-label="前の月">‹</button><h2 id="calTitle"></h2><button class="nav" id="calNext" aria-label="次の月">›</button><button class="b" id="calToday">今日</button><div class="calview" id="calView"><button data-v="month">月</button><button data-v="week">週</button></div><button class="x" id="calClose" aria-label="閉じる">×</button></div>

</section>
<div class="treepane" id="treePane"><iframe id="treeFrame" title="TODO Tree"></iframe></div>

<button class="trash" id="bTrash" aria-label="チェックしたタスクをゴミ箱へ"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><b id="trashN"></b></button>
<button class="fab" id="fab" aria-label="タスクを追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="toast" id="toast" hidden><span id="toastT"></span><button id="toastU">元に戻す</button></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<aside class="drawer" id="drawer" hidden></aside>
<div class="composer" id="composer" hidden>
  <div class="crow"><textarea class="in" id="cText" rows="1" placeholder="新しいタスク（改行区切りでまとめて追加）" enterkeyhint="send"></textarea>
    <button class="send" id="cSend" aria-label="追加"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
  <div class="cchips" id="cChips"></div>
</div>

<script src="firebase-config.js"></script>
<script>
const KEY = 'todo-list-v1';
const PRIO = { '': 'なし', high: '高', mid: '中', low: '低' };
const COLORS = { '': 'なし', pink: 'ピンク', yellow: '黄', blue: '青', green: '緑', gray: 'グレー' };
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const mainEl = $('main'), tabsEl = $('tabs'), sheet = $('sheet'), scrim = $('scrim'), drawer = $('drawer'), composer = $('composer'), cText = $('cText');
const swatch = c => c ? `var(--c-${c})` : 'var(--bg)';
let S, query = '';

/* ---------- data ---------- */
// lists = the tabs, each with its own sections (TODAY, 明日やること, …); items point at a list and a section
function seed() {
  const sec = name => ({ id: uid(), name });
  const priv = { id: uid(), name: 'プライベート', sections: [sec('TODAY'), sec('明日やること'), sec('いつか')] };
  const task = { id: uid(), name: 'タスク', sections: [sec('TODAY'), sec('明日やること')] };
  const prio = { id: uid(), name: '優先度A（重要度高）', sections: [sec('TODAY')] };
  const items = [];
  const add = (l, s, text, color = '') => items.push({ id: uid(), list: l.id, sec: l.sections[s].id, text, done: false, doneAt: 0, trash: false, color, memo: '', order: items.length });
  add(task, 0, '契約書作成');
  add(task, 0, '銀行入金', 'pink');
  add(task, 0, '開発見積もり再送', 'pink');
  add(task, 0, '名刺作成', 'pink');
  add(task, 0, '和通連絡');
  add(task, 0, '機能追加（hugからの取り込み/事業所ごとの設定、連絡帳）23:00-24:00');
  add(task, 0, '旅行計画');
  add(task, 1, '21に連絡');
  return normalize({ lists: [priv, task, prio], items, cur: task.id });
}
// date is the day a task starts (or its only day); end is set only when it runs on to a later day
function dateRange(date, end) {
  const D = /^\d{4}-\d{2}-\d{2}$/;
  date = D.test(date) ? date : ''; end = D.test(end) ? end : '';
  if (!date) [date, end] = [end, ''];
  return { date, end: end > date ? end : '' };
}
function normalize(s) {
  const lists = (s.lists || []).filter(l => l && l.id != null).map(l => ({
    id: String(l.id), name: String(l.name ?? ''),
    sections: (l.sections || []).filter(x => x && x.id != null).map(x => ({ id: String(x.id), name: String(x.name ?? '') }))
  }));
  if (!lists.length) lists.push({ id: uid(), name: 'タスク', sections: [] });
  for (const l of lists) if (!l.sections.length) l.sections.push({ id: uid(), name: 'TODAY' });
  const listOf = {};
  for (const l of lists) for (const x of l.sections) listOf[x.id] = l;
  const items = (s.items || []).filter(i => i && i.id != null && lists.some(l => l.id === String(i.list))).map(i => {
    const list = String(i.list), l = lists.find(l => l.id === list);
    return { id: String(i.id), list, sec: listOf[i.sec] === l ? String(i.sec) : l.sections[0].id, text: String(i.text ?? ''),
      // before the bin button existed, a checked task went straight into the bin
      done: !!i.done, doneAt: +i.doneAt || 0, trash: 'trash' in i ? !!i.trash : !!i.done, color: i.color in COLORS ? i.color : '', memo: String(i.memo || ''), order: +i.order || 0,
      prio: i.prio in PRIO ? i.prio : '', doing: !!i.doing, ...dateRange(i.date, i.end) };
  });
  return { lists, items, cur: lists.some(l => l.id === s.cur) ? s.cur : lists[0].id,
    collapsed: s.collapsed || {}, lastSec: s.lastSec || {}, addTop: !!s.addTop, calHide: s.calHide || {}, calView: s.calView === 'week' ? 'week' : 'month',
    splitW: +s.splitW || 460, cur2: s.cur2,
    // beside the list: TODO Tree and/or a second list (earlier versions showed one or the other)
    right: 'right' in s ? (['tree', 'cal'].includes(s.right) ? s.right : '')
      : ('showTree' in s ? !!s.showTree : s.split !== false && s.pane !== 'list') ? 'tree' : '',
    showCols: 'showCols' in s ? !!s.showCols : s.split !== false && s.pane === 'list' };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.lists)) return normalize(s); } catch (e) {}
  return seed();
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function commit() { saveLocal(); render(); queueCloud(); }

const curList = () => S.lists.find(l => l.id === S.cur);
const byOrder = (a, b) => a.order - b.order;
const openIn = sec => S.items.filter(i => i.sec === sec && !i.trash).sort(byOrder);
const openCount = list => S.items.filter(i => i.list === list && !i.trash && !i.done).length;
const checkedIn = list => S.items.filter(i => i.list === list && !i.trash && i.done);
function nextOrder(sec) {
  const o = S.items.filter(i => i.sec === sec).map(i => i.order);
  return !o.length ? 0 : S.addTop ? Math.min(...o) - 1 : Math.max(...o) + 1;
}
const findItem = id => S.items.find(i => i.id === id);

/* ---------- undo (one step, from the toast) ---------- */
let undoSnap = null, toastTimer = 0;
const snapshot = () => JSON.stringify({ lists: S.lists, items: S.items });
function toast(text, snap) {
  undoSnap = snap || null;
  $('toastT').textContent = text; $('toastU').hidden = !snap; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; undoSnap = null; }, 4500);
}
$('toastU').onclick = () => {
  if (!undoSnap) return;
  const r = normalize({ ...JSON.parse(undoSnap), cur: S.cur });
  S.lists = r.lists; S.items = r.items; S.cur = r.cur;
  undoSnap = null; $('toast').hidden = true; commit();
};

/* ---------- render ---------- */
const twoCols = () => document.body.classList.contains('pane-list');
// the lists on screen: the main one, and the right-hand one when two are side by side
const shownLists = () => twoCols() && S.cur2 !== S.cur ? [S.cur, S.cur2] : [S.cur];
function render() {
  if (!S.lists.some(l => l.id === S.cur2)) S.cur2 = (S.lists.find(l => l.id !== S.cur) || S.lists[0]).id;
  renderTabs(tabsEl, S.cur, switchList); renderMain();
  if (twoCols()) {
    renderTabs($('tabs2'), S.cur2, id => { S.cur2 = id; saveLocal(); render(); $('col2').scrollTop = 0; });
    renderSections($('main2'), S.lists.find(l => l.id === S.cur2));
  }
  $('trashN').textContent = shownLists().reduce((n, id) => n + checkedIn(id).length, 0) || '';
  if (calShown()) renderCal();
}
function renderTabs(box, cur, pick) {
  const tabs = S.lists.map(l => {
    const b = el('button', 'tab' + (l.id === cur ? ' on' : ''));
    b.append(el('span', 'tn', l.name || '（無題）'), el('span', 'tc', openCount(l.id)));
    // tap switches; tapping the open tab again edits it
    b.onclick = () => l.id === cur ? editList(l.id) : pick(l.id);
    return b;
  });
  const add = el('button', 'tab add', '＋'); add.setAttribute('aria-label', 'リストを追加'); add.onclick = newList;
  box.replaceChildren(...tabs, add);
  const on = box.querySelector('.tab.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
// 2026-11-23 -> 11/23(月)
const WD = '日月火水木金土';
const localDay = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function dateText(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${m}/${d}(${WD[new Date(y, m - 1, d).getDay()]})`;
}
function dateCell(it) {
  const today = localDay(), c = el('div', 'dcol', dateText(it.date)), last = it.end || it.date;
  if (it.end) c.append(el('small', '', '〜' + dateText(it.end)));
  if (it.date && !it.done && it.date <= today) c.classList.add(last >= today ? 'today' : 'late');
  return c;
}
function row(it, where) {
  const r = el('div', 'item' + (it.color ? ' c-' + it.color : '') + (it.done ? ' checked' : ''));
  r.dataset.id = it.id;
  const c = el('button', 'circle'); c.setAttribute('aria-label', it.done ? 'チェックを外す' : 'チェックする');
  c.onclick = e => { e.stopPropagation(); toggleCheck(it.id); };
  const t = el('div', 'txt');
  if (where) t.append(el('div', 'where', where));
  t.append(document.createTextNode(it.text));
  if (it.memo) t.append(el('div', 'memo', it.memo));
  r.append(c, dateCell(it), t);
  if (it.prio || it.doing) {
    const tags = el('div', 'tags');
    if (it.prio) tags.append(el('span', 'tag ' + it.prio, PRIO[it.prio]));
    if (it.doing) tags.append(el('span', 'tag doing', '対応中'));
    r.append(tags);
  }
  r.onclick = () => { if (!justDragged) editItem(it.id); };
  return r;
}
function renderMain() {
  if (query) return renderSearch();
  renderSections(mainEl, curList());
}
function renderSections(box0, l) {
  const secs = l.sections.map(x => {
    const open = openIn(x.id), closed = !!S.collapsed[x.id];
    const s = el('section', 'sec' + (closed ? ' closed' : '')); s.dataset.sec = x.id;
    const h = el('div', 'shead');
    const name = el('button', 'sname', x.name || '（無題）'); name.onclick = () => editList(l.id, x.id);
    const fold = el('button', 'sfold'); fold.setAttribute('aria-label', closed ? '開く' : '閉じる');
    fold.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    const toggle = () => { if (S.collapsed[x.id]) delete S.collapsed[x.id]; else S.collapsed[x.id] = true; saveLocal(); render(); };
    fold.onclick = toggle;
    const cnt = el('span', 'scount', open.filter(i => !i.done).length); cnt.onclick = toggle;
    h.append(name, cnt, fold);
    const box = el('div', 'items');
    if (open.length) box.append(...open.map(it => row(it)));
    else box.append(el('div', 'empty', 'タスクはありません'));
    s.append(h, box);
    return s;
  });
  const add = el('button', 'addsec', '＋ セクションを追加');
  add.onclick = () => { const x = { id: uid(), name: '新しいセクション' }; l.sections.push(x); commit(); editList(l.id, x.id); };
  box0.replaceChildren(...secs, add);
}
function renderSearch() {
  const q = query.toLowerCase();
  const hits = S.items.filter(i => !i.trash && (i.text + '\n' + i.memo).toLowerCase().includes(q));
  const out = [el('div', 'rhead', `「${query}」 ${hits.length}件`)];
  for (const l of S.lists) for (const x of l.sections) {
    for (const it of hits.filter(i => i.sec === x.id).sort(byOrder)) out.push(row(it, `${l.name} › ${x.name}`));
  }
  if (!hits.length) out.push(el('div', 'empty', '見つかりませんでした'));
  mainEl.replaceChildren(...out);
}
function switchList(id, dir = 0) {
  if (!S.lists.some(l => l.id === id)) return;
  S.cur = id; saveLocal(); render(); scrollTo(0, 0);
  if (dir) { mainEl.classList.remove('slide-l', 'slide-r'); void mainEl.offsetWidth; mainEl.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }
}

/* ---------- check / bin / restore ---------- */
function toggleCheck(id) {
  const it = findItem(id); if (!it) return;
  it.done = !it.done; it.doneAt = it.done ? Date.now() : 0;
  commit();
}
// the bin button: checked tasks of this list go into the bin; with none checked it shows what is in there
function binChecked() {
  const done = shownLists().flatMap(checkedIn);
  if (!done.length) return openTrash();
  const snap = snapshot(), now = Date.now();
  for (const it of done) { it.trash = true; it.doneAt = now; }
  commit(); toast(`${done.length}件をゴミ箱に入れました`, snap);
}
function restore(id) {
  const it = findItem(id); if (!it) return;
  it.trash = false; it.done = false; it.doneAt = 0; it.order = nextOrder(it.sec); commit();
}

/* ---------- sheets ---------- */
let onSheetClose = null;
function openSheet(title, build, onClose) {
  closeAll();
  const head = el('div', 'shd'), x = el('button', 'x', '×');
  x.setAttribute('aria-label', '閉じる'); x.onclick = closeSheet;
  head.append(el('h2', '', title), x);
  const body = el('div');
  sheet.replaceChildren(head, body);
  build(body);
  onSheetClose = onClose || null;
  sheet.hidden = false; scrim.hidden = false;
  placeFloating();
}
function closeSheet() {
  if (sheet.hidden) return;
  sheet.hidden = true; scrim.hidden = true;
  const f = onSheetClose; onSheetClose = null;
  if (f) f();
  render(); applyRemote();
}
function closeAll() { closeSheet(); closeDrawer(); closeComposer(); }
scrim.onclick = closeAll;
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (query) closeSearch(); closeAll(); }
  else if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && sheet.hidden && composer.hidden) { e.preventDefault(); openComposer(); }
});
const autosize = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
function field(box, label, input) { const l = el('label', '', label); box.append(l, input); return input; }
function swatches(cur, pick) {
  const w = el('div', 'sw');
  for (const [c, name] of Object.entries(COLORS)) {
    const b = el('button', c === cur ? 'on' : ''); b.style.background = swatch(c); b.title = name; b.setAttribute('aria-label', name);
    b.onclick = () => { w.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); pick(c); };
    w.append(b);
  }
  return w;
}
// small edits made in a sheet are saved as they are typed
function touched() { saveLocal(); queueCloud(); }

function editItem(id) {
  const it = findItem(id); if (!it) return;
  openSheet('タスクを編集', box => {
    const name = field(box, 'タスク名', el('textarea', 'in')); name.value = it.text; name.rows = 1;
    name.oninput = () => { it.text = name.value; autosize(name); touched(); };
    const where = field(box, 'リスト › セクション', el('select', 'in'));

/* ---------- reorder by long press, and swipe between tabs ---------- */
let drag = null, justDragged = false;
function beginDrag(r, x, y) {
  const it = findItem(r.dataset.id); if (!it) return;
  const b = r.getBoundingClientRect(), ph = el('div', 'ph');
  ph.style.height = b.height + 'px';
  r.before(ph);
  r.classList.add('dragging');
  Object.assign(r.style, { position: 'fixed', left: b.left + 'px', top: b.top + 'px', width: b.width + 'px' });
  drag = { r, ph, it, dy: y - b.top, dx: x - b.left, x, y, target: it.sec };

}

// the column under the pointer
const colAt = x => twoCols() && x > $('col2').getBoundingClientRect().left ? $('main2') : mainEl;
function placeDrop() {

  if (!secs.length) return;
  document.querySelectorAll('.sec.drop').forEach(s => s.classList.remove('drop'));
  const sec = secs.find(s => { const b = s.getBoundingClientRect(); return y >= b.top && y < b.bottom; })
    || (y < secs[0].getBoundingClientRect().top ? secs[0] : secs[secs.length - 1]);
  secs.forEach(s => s.classList.toggle('drop', s === sec && s.classList.contains('closed')));

  const box = sec.querySelector('.items');
  const before = [...box.querySelectorAll('.item:not(.dragging)')].find(x => { const b = x.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (before) { if (drag.ph.nextElementSibling !== before) before.before(drag.ph); }

}

    : [...openIn(target).filter(i => i !== it).map(i => i.id), it.id];
  it.sec = target;
  it.list = S.lists.find(l => l.sections.some(x => x.id === target)).id;
  ids.forEach((id, n) => { const x = findItem(id); if (x) x.order = n; });

}

const onPress = e => {

  const move = ev => {

    } catch (e) { msg.textContent = AUTH_MSG[e.code] || `ログインできませんでした（${e.code || e.message}）`; }
  };
  pass.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(false); });
  const acts = el('div', 'acts'), li = el('button', 'b pri', 'ログイン'), su = el('button', 'b', '新規登録');
  li.onclick = () => go(false); su.onclick = () => go(true);
  acts.append(li, su);
  box.replaceChildren(el('p', 'note', 'TODO Tree と同じメールアドレスでログインしてください。'),
    el('label', '', 'メールアドレス'), email, el('label', '', 'パスワード（6文字以上）'), pass, acts, msg);
}

/* ---------- boot ---------- */
S = load();
saveLocal();
render();
applySplit();
if (window.FIREBASE_CONFIG) initFirebase(window.FIREBASE_CONFIG); else setSync('off', 'この端末のみ');
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
// a newer version took over (it activates straight away): reload once so the new page is what is on screen
if ('serviceWorker' in navigator && navigator.serviceWorker.controller)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!window.__reloading) { window.__reloading = true; location.reload(); } });
</script>
